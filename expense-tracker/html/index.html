<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="../css/style.css"/>
  </head>
  <body>
    <div class="container">
      <h1>💰 Expense Tracker</h1>
      <!---- ========  Expense Form ======= -->
      <form id="expenseForm">
        <div class="form-group">
          <label for="description"> Description </label>
          <input type="text" id="description" placeholder="Enter expense description" required/>
        </div>
        <div class="form-group">
          <label for="amount"> Amount </label>
          <input type="number" id="amount" placeholder="Enter amount" min="1" required/>
        </div>
        <div class="form-group">
          <label for="category"> Category </label>
          <select id="category">
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Others">Others</option>
          </select>
        </div>
        <div class="form-group">
          <label for="date"> Date </label>
          <input type="date" id="date" required />
        </div>
        <button type="submit" id="addBtn">Add Expense</button>
      </form>
      <!-- ========  Search ======= -->
      <div class="filter-box">
        <label for="searchExpense"> Search Expense </label>
        <input type="text" id="searchExpense" placeholder="Search by description"/>
      </div>
      <!---========  Filter ======= -->
      <div class="filter-box">
        <label for="filterCategory"> Filter By Category </label>
        <select id="filterCategory">
          <option value="All">All</option>
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Shopping">Shopping</option>
          <option value="Bills">Bills</option>
          <option value="Others">Others</option>
        </select>
      </div>
      <!---- =========  Summary ======= -->
      <div class="summary">
        <h2>Summary</h2>
        <p id="totalExpense">Total Expense : ₹0</p>
        <p id="foodTotal">Food : ₹0</p>
        <p id="travelTotal">Travel : ₹0</p>
        <p id="shoppingTotal">Shopping : ₹0</p>
        <p id="billsTotal">Bills : ₹0</p>
        <p id="othersTotal">Others : ₹0</p>
      </div>
      <!----========  Clear All Button ====== -->
      <button id="clearAllBtn">Clear All Expenses</button>
      <!---- =========  Expense Table ======= -->
      <table>
        <thead>
          <tr>
            <th>Description</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="expenseList"></tbody>
      </table>
      <!-- Empty State -->
      <p class="empty" id="emptyMessage">No expenses added.</p>
      <!----======= Deleted History ====== -->
      <div class="history-box">
        <h3>🗑 Deleted History</h3>
        <p id="emptyHistory">No deleted history.</p>
        <ul id="historyList"></ul>
      </div>
    </div>
    <script type="module" src="../js/script.js"></script>
  </body>
</html>
